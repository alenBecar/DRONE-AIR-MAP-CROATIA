worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  types { application/geo+json geojson; application/vnd.pmtiles pmtiles; }
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  gzip on;
  gzip_types application/json application/geo+json text/css application/javascript application/wasm;
  gzip_min_length 1024;
  proxy_cache_path /data/cache/sat levels=1:2 keys_zone=sat:32m max_size=5g inactive=365d use_temp_path=off;
  resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;

  server {
    listen 80 default_server;
    root /app/web;

    location = /healthz { return 200 "ok\n"; }
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location /fonts/  { add_header Cache-Control "public, max-age=2592000"; }
    location /sprites/ { add_header Cache-Control "public, max-age=2592000"; }

    # pipeline output (JSON refreshed by the scheduler, pmtiles served with range requests)
    location /data/ {
      alias /data/pub/;
      add_header Cache-Control "no-cache";
      location ~ \.tmp$ { return 404; }
    }

    # Sentinel-2 cloudless satellite tiles, cached on disk
    location ~ ^/sat/(\d+)/(\d+)/(\d+)\.jpg$ {
      set $eox https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2024_3857/default/g/$1/$2/$3.jpg;
      proxy_pass $eox;
      proxy_ssl_server_name on;
      proxy_set_header Host tiles.maps.eox.at;
      proxy_set_header User-Agent "air-map-croatia/1.0 (dron.alenbecar.com)";
      proxy_cache sat;
      proxy_cache_valid 200 365d;
      proxy_cache_valid 404 7d;
      proxy_cache_lock on;
      proxy_ignore_headers Cache-Control Expires Set-Cookie;
      proxy_hide_header Set-Cookie;
      add_header Cache-Control "public, max-age=2592000";
      add_header X-Cache $upstream_cache_status;
    }
  }
}
